; Installed by provision.sh as /etc/php/<version>/{fpm,cli}/conf.d/90-caderneta-sef.ini.

expose_php = Off
date.timezone = UTC

; Releases are switched by a symlink and PHP-FPM is reloaded on every deploy,
; so OPcache never needs to look at file times.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Stack traces in the logs must not carry argument values: Google tokens and
; database passwords pass through function calls.
zend.exception_ignore_args = On
