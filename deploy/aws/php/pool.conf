; Installed by provision.sh as /etc/php/<version>/fpm/pool.d/caderneta-sef.conf.
; Sized for a t3.small (2 GiB): about 50 MB per worker, room for the
; queue worker, the scheduler and the operating system.

[caderneta-sef]
user = www-data
group = www-data

listen = /run/php/caderneta-sef.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

request_terminate_timeout = 60s
security.limit_extensions = .php
catch_workers_output = yes
decorate_workers_output = no

php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 30
php_admin_value[post_max_size] = 2M
php_admin_value[upload_max_filesize] = 1M
php_admin_value[open_basedir] = /var/www/caderneta-sef:/etc/ssl/certs:/tmp:/usr/share/zoneinfo
