# Installed by deploy/aws/bin/provision.sh as
# /etc/nginx/sites-available/caderneta-sef.conf, with __DOMAIN__,
# __OTHER_NAMES__ and __PHP_SOCKET__ replaced. TLS certificates come from
# Let's Encrypt; one certificate covers the domain and the other names.

# Paths only: query strings carry signed reminder links and tokens.
log_format caderneta '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time "$http_user_agent"';

limit_req_zone $binary_remote_addr zone=caderneta_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ __OTHER_NAMES__;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__ __OTHER_NAMES__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:caderneta_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Other names (www, the previous domain) send people to the main one.
    # The API, the signed confirmation links and the files they load still
    # answer there: apps installed before the move call the old address, and
    # a signed link only matches the address it was sent with. The original
    # $request_uri is tested, not $uri: Laravel is reached through an
    # internal redirect to /index.php, which runs these rules again.
    set $moved "";
    if ($host != "__DOMAIN__") {
        set $moved "1";
    }
    if ($request_uri ~ ^/(api/|confirmacao/|build/|favicon|up(\?|$))) {
        set $moved "";
    }
    if ($moved) {
        return 301 https://__DOMAIN__$request_uri;
    }

    root /var/www/caderneta-sef/current/public;
    index index.php;
    charset utf-8;

    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/caderneta-sef.access.log caderneta;
    error_log /var/log/nginx/caderneta-sef.error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location ~ /\.(?!well-known) {
        deny all;
    }

    # Vite output has a hash in every file name.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Server-mode PWA, built by deploy.sh --with-pwa. It talks to /api on
    # this same host, so it needs no CORS and keeps no data offline.
    location /app/ {
        index index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        # The app routes with #/..., so every real path is a file.
        try_files $uri $uri/ =404;

        location ~ \.webmanifest$ {
            default_type application/manifest+json;
        }
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }

    location ~ ^/(login|api/v1/login|api/v1/forgot-password|forgot-password)$ {
        limit_req zone=caderneta_login burst=10 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only the front controller runs; any other .php file is not found.
    location = /index.php {
        fastcgi_pass unix:__PHP_SOCKET__;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }
}
